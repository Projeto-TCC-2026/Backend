# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway - desabilitado temporariamente para permitir inicialização limpa
spring.flyway.enabled=false

# JPA - usar create-drop para recriar tabelas automaticamente
spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=myTemporarySecretKeyForDevelopment123456789012345678901234567890123456789012345678901234567890
jwt.expiration=900000
jwt.refresh-expiration=604800000
