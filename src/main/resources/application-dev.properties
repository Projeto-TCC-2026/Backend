# Flyway
spring.flyway.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Password Reset
app.password-reset.token-expiration-minutes=15
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL}
app.password-reset.sqs-enabled=true
app.password-reset.sqs-queue-url=${APP_PASSWORD_RESET_SQS_QUEUE_URL}
app.password-reset.aws-region=${AWS_REGION}

# Nome falso de propósito: localmente o cache nunca grava no bucket de produção.
# A gravação falha no log e o dashboard lê direto do banco (fallback).
app.dashboard-cache.s3-bucket=dev-local-sem-cache