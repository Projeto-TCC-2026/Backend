spring.application.name=tcc

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Custom OpenAPI URLs
tcc.openapi.dev-url=http://localhost:8080
#tcc.openapi.prod-url=https://sua-url-de-producao.com

# Server Configuration
server.port=8080

# Actuator: expõe apenas o endpoint de health
management.endpoints.web.exposure.include=health
# /actuator/health é público no SecurityConfig, então o status resumido fica
# visível sem token. Os detalhes dos componentes (banco, disco) só aparecem
# para quem está autenticado e tem a role abaixo.
management.endpoint.health.show-details=when-authorized
# Sem o prefixo ROLE_: o Actuator resolve a role via
# HttpServletRequest.isUserInRole, que adiciona o prefixo quando ele falta.
# As authorities são criadas como ROLE_ADMIN em UserDetailsServiceImpl.
management.endpoint.health.roles=ADMIN

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

app.password-reset.token-expiration-minutes=15
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL}
app.password-reset.sqs-enabled=true
app.password-reset.sqs-queue-url=${APP_PASSWORD_RESET_SQS_QUEUE_URL}
app.password-reset.aws-region=${AWS_REGION}

# Cache do dashboard no S3 (bucket privado, acesso apenas pelo backend)
app.dashboard-cache.aws-region=${AWS_REGION}
app.dashboard-cache.s3-bucket=${DASHBOARD_CACHE_S3_BUCKET}
app.dashboard-cache.admin-key=dashboard/admin.json
# Intervalo de recálculo do dashboard admin (1 hora)
app.dashboard-cache.refresh-interval-ms=3600000
# Espera antes da primeira execução do job (5 minutos)
app.dashboard-cache.initial-delay-ms=300000

# Boas-vindas / primeiro acesso (conta criada pelo hospital/doutor)
# Desabilitado por padrão até a stack CloudFormation "boas-vindas" ser implantada
# e a fila real ser informada via APP_ACCOUNT_ACTIVATION_SQS_QUEUE_URL.
app.account-activation.token-expiration-minutes=4320
app.account-activation.frontend-base-url=${FRONTEND_BASE_URL}
app.account-activation.sqs-enabled=${APP_ACCOUNT_ACTIVATION_SQS_ENABLED:false}
app.account-activation.sqs-queue-url=${APP_ACCOUNT_ACTIVATION_SQS_QUEUE_URL:}

# Push notification de alerta, via Expo Push Service.
# Desabilitado por padrão: com app.push.enabled=false entra o NoOp e o ambiente
# de desenvolvimento sobe sem depender de rede externa.
app.push.enabled=${APP_PUSH_ENABLED:false}
app.push.expo-endpoint=${APP_PUSH_EXPO_ENDPOINT:https://exp.host/--/api/v2/push/send}
app.push.connect-timeout-ms=3000
app.push.read-timeout-ms=5000
