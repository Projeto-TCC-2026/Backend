# PostgreSQL (Neon)
spring.datasource.url=jdbc:postgresql://ep-small-poetry-ac9pj9cg.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# JPA dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Prod: show-sql desabilitado (sobrescreve o default)
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

app.password-reset.token-expiration-minutes=15
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL}
app.password-reset.sqs-enabled=true
app.password-reset.sqs-queue-url=${APP_PASSWORD_RESET_SQS_QUEUE_URL}
app.password-reset.aws-region=${AWS_REGION}