services:
  postgres:
    image: postgres:17
    container_name: tcc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      APP_PASSWORD_RESET_SQS_QUEUE_URL: ${APP_PASSWORD_RESET_SQS_QUEUE_URL}
      APP_ACCOUNT_ACTIVATION_SQS_ENABLED: ${APP_ACCOUNT_ACTIVATION_SQS_ENABLED:-false}
      APP_ACCOUNT_ACTIVATION_SQS_QUEUE_URL: ${APP_ACCOUNT_ACTIVATION_SQS_QUEUE_URL:-}
      DASHBOARD_CACHE_S3_BUCKET: ${DASHBOARD_CACHE_S3_BUCKET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    ports:
      - "8080:8080"

volumes:
  postgres_data: